<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşçilik Takibi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .konteyner { width: 100%; max-width: 600px; }
        
        #login-ekrani { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        .input-sifre { width: 80%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 6px; margin-bottom: 15px; text-align: center; letter-spacing: 5px; }
        .btn-giris { background: #0056b3; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 85%; }
        
        #ana-ekran { display: none; }
        .baslik { text-align: center; color: #333; margin-bottom: 20px; }
        
        .personel-karti { background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #0056b3; }
        .personel-bilgi { display: flex; flex-direction: column; }
        .sicil { font-size: 13px; color: #666; font-weight: bold; margin-bottom: 3px; }
        .isim { font-size: 17px; color: #222; font-weight: bold; }
        
        .btn-tik { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-tik:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.9; }
    </style>
</head>
<body>

<div class="konteyner">
    
    <!-- ŞİFRE EKRANI -->
    <div id="login-ekrani">
        <h2 style="color: #333; margin-bottom: 25px;">Sisteme Giriş</h2>
        <input type="password" id="sifreKutusu" class="input-sifre" placeholder="Şifre" maxlength="4">
        <br>
        <button class="btn-giris" onclick="sistemeGiris()" id="btnGiris">Giriş Yap</button>
        <p id="hataMesaji" style="color: red; display: none; margin-top:15px;"></p>
    </div>

    <!-- LİSTE EKRANI (Şifre doğruysa açılır) -->
    <div id="ana-ekran">
        <h2 class="baslik">Günlük İşçilik Takibi</h2>
        <!-- İsimler buraya çizilecek -->
        <div id="personelListesiAlani"></div>
    </div>

</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztetwF50mZkG86_HBz55xmAxuusZ1hboj3Iu2Zji6dNant4XtoN1X6CP4eQalhonJ0/exec"; 
    let aktifSifre = ""; // Şifreyi güvenlik için js hafızasında tutuyoruz

    // 1. ŞİFRE İLE LİSTEYİ GETİR
    function sistemeGiris() {
        aktifSifre = document.getElementById("sifreKutusu").value;
        if(aktifSifre === "") return;

        let btn = document.getElementById("btnGiris");
        btn.innerText = "Bağlanıyor...";
        btn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL + "?islem=liste_getir&sifre=" + aktifSifre)
            .then(response => response.json())
            .then(data => {
                btn.innerText = "Giriş Yap";
                btn.disabled = false;

                if(data.hata) {
                    document.getElementById("hataMesaji").innerText = data.hata;
                    document.getElementById("hataMesaji").style.display = "block";
                } else {
                    // Şifre doğru! Arayüzü aç ve isimleri Google'dan gelen verilerle çiz
                    document.getElementById("login-ekrani").style.display = "none";
                    document.getElementById("ana-ekran").style.display = "block";
                    arayuzuCiz(data.personeller, data.bugunGelenler);
                }
            })
            .catch(err => {
                btn.innerText = "Giriş Yap";
                btn.disabled = false;
                document.getElementById("hataMesaji").innerText = "Bağlantı koptu!";
                document.getElementById("hataMesaji").style.display = "block";
            });
    }

    // 2. GOOGLE'DAN GELEN VERİLERLE BUTONLARI ÇİZ
    function arayuzuCiz(personeller, bugunGelenler) {
        const alan = document.getElementById("personelListesiAlani");
        alan.innerHTML = "";
        
        personeller.forEach(p => {
            // Bu sicil "bugunGelenler" listesinde var mı?
            let dahaOnceTiklenmis = bugunGelenler.includes(p.sicil);
            
            let btnHTML = "";
            if (dahaOnceTiklenmis) {
                // Önceden tıklanmışsa gri ve pasif buton yap
                btnHTML = `<button class="btn-tik" style="background:#6c757d;" disabled>Kaydedildi (Bugün)</button>`;
            } else {
                // Tıklanmamışsa yeşil ve aktif buton yap
                btnHTML = `<button id="btn-${p.sicil}" class="btn-tik" onclick="tikAt('${p.sicil}', '${p.isim}')">Tik At ✓</button>`;
            }

            alan.innerHTML += `
                <div class="personel-karti">
                    <div class="personel-bilgi">
                        <span class="sicil">SİCİL: ${p.sicil}</span>
                        <span class="isim">${p.isim}</span>
                    </div>
                    ${btnHTML}
                </div>
            `;
        });
    }

    // 3. TİKE BASILDIĞINDA GOOGLE'A GÖNDER
    function tikAt(sicil, isim) {
        let btn = document.getElementById(`btn-${sicil}`);
        btn.innerText = "Yükleniyor...";
        btn.disabled = true;

        // Şifreyi de gönderiyoruz ki arka planda yetkisiz biri URL'den istek atamasın
        let url = `${GOOGLE_SCRIPT_URL}?islem=yaz&sifre=${aktifSifre}&sicil=${sicil}&isim=${encodeURIComponent(isim)}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if(data.sonuc === "basarili") {
                    btn.innerText = "Kaydedildi ✓";
                    btn.style.background = "#6c757d"; // Butonu gri yap
                } else {
                    alert(data.hata);
                    btn.innerText = "Tik At ✓";
                    btn.disabled = false;
                }
            })
            .catch(error => {
                alert("Bağlantı hatası. Tekrar deneyin.");
                btn.innerText = "Tik At ✓";
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
