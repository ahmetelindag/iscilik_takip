<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşçilik Takip Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .konteyner { width: 100%; max-width: 600px; }
        
        /* Şifre Ekranı Tasarımı */
        #login-ekrani { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        .input-sifre { width: 80%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 6px; margin-bottom: 15px; text-align: center; letter-spacing: 5px; }
        .btn-giris { background: #0056b3; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 85%; }
        
        /* Ana Sistem Ekranı */
        #ana-ekran { display: none; } /* Başlangıçta gizli */
        .baslik { text-align: center; color: #333; margin-bottom: 20px; }
        
        /* Modern Tablo (Liste) Tasarımı */
        .personel-karti { background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #0056b3; }
        .personel-bilgi { display: flex; flex-direction: column; }
        .sicil { font-size: 13px; color: #666; font-weight: bold; margin-bottom: 3px; }
        .isim { font-size: 17px; color: #222; font-weight: bold; }
        
        .btn-tik { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-tik:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.8; }
        
        /* Yükleniyor Uyarısı */
        #yukleniyor { text-align: center; font-weight: bold; color: #0056b3; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="konteyner">
    
    <!-- 1. ŞİFRE GİRİŞ EKRANI -->
    <div id="login-ekrani">
        <h2 style="color: #333; margin-bottom: 25px;">Sisteme Giriş</h2>
        <input type="password" id="sifreKutusu" class="input-sifre" placeholder="Şifre" maxlength="4">
        <br>
        <button class="btn-giris" onclick="sifreKontrol()">Giriş Yap</button>
        <p id="hataMesaji" style="color: red; display: none; margin-top:15px;">Hatalı şifre!</p>
    </div>

    <!-- 2. ANA TAKİP EKRANI (Başarılı girişte açılır) -->
    <div id="ana-ekran">
        <h2 class="baslik">Günlük İşçilik Takibi</h2>
        <div id="yukleniyor">Veritabanı kontrol ediliyor... Lütfen bekleyin.</div>
        
        <!-- Personel listesi JavaScript ile buraya otomatik çizilecek -->
        <div id="personelListesiAlani"></div>
    </div>

</div>

<script>
    // --- SİSTEM AYARLARI ---
    const SISTEM_SIFRESI = "1234"; 
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZcyMmK4jnOU-9Qz-szvwn2_9RABEMWlZpDuFzX5cLU28_AYXb38M4Yzn7JTe0yyTs/exec"; // Yeni deploy ettiğin URL'yi buraya yapıştır
    
    // YENİ PERSONEL EKLENECEĞİ ZAMAN SADECE BU LİSTEYE YAZMAN YETERLİ! (HTML kopyalamaya gerek yok)
    const personeller = [
        { sicil: "1001", isim: "Ahmet Elindağ" },
        { sicil: "1002", isim: "Mehmet Yılmaz" },
        { sicil: "1003", isim: "Ayşe Demir" },
        { sicil: "1004", isim: "Fatma Kaya" }
    ];

    // --- 1. ŞİFRE KONTROLÜ ---
    function sifreKontrol() {
        const girilen = document.getElementById("sifreKutusu").value;
        if (girilen === SISTEM_SIFRESI) {
            document.getElementById("login-ekrani").style.display = "none";
            document.getElementById("ana-ekran").style.display = "block";
            
            // Giriş başarılı olunca, arayüzü çiz ve bugünün verilerini Google'dan çek
            arayuzuCiz();
            bugunKimlerGeldiKontrolEt();
        } else {
            document.getElementById("hataMesaji").style.display = "block";
            document.getElementById("sifreKutusu").value = "";
        }
    }

    // --- 2. ARAYÜZÜ (TABLOYU) OTOMATİK ÇİZME ---
    function arayuzuCiz() {
        const alan = document.getElementById("personelListesiAlani");
        alan.innerHTML = ""; // İçini temizle
        
        personeller.forEach(p => {
            alan.innerHTML += `
                <div class="personel-karti">
                    <div class="personel-bilgi">
                        <span class="sicil">SİCİL: ${p.sicil}</span>
                        <span class="isim">${p.isim}</span>
                    </div>
                    <button id="btn-${p.sicil}" class="btn-tik" onclick="tikAt('${p.sicil}', '${p.isim}')">Tik At ✓</button>
                </div>
            `;
        });
    }

    // --- 3. GOOGLE'DAN BUGÜNÜN VERİSİNİ OKUMA (Çok Kritik Aşama) ---
    function bugunKimlerGeldiKontrolEt() {
        document.getElementById("yukleniyor").style.display = "block";
        
        // islem=oku parametresiyle Google Apps Script'e istek atıyoruz
        fetch(GOOGLE_SCRIPT_URL + "?islem=oku")
            .then(response => response.json())
            .then(bugunGelenSiciller => {
                document.getElementById("yukleniyor").style.display = "none";
                
                // Google'dan gelen sicil numaralarına sahip butonları KİLİTLE
                bugunGelenSiciller.forEach(sicilNo => {
                    let btn = document.getElementById(`btn-${sicilNo}`);
                    if (btn) {
                        btn.innerText = "Kaydedildi (Bugün)";
                        btn.disabled = true;
                        btn.style.borderLeft = "none"; // İsteğe bağlı tasarım değişimi
                    }
                });
            })
            .catch(err => {
                document.getElementById("yukleniyor").innerText = "Bağlantı hatası! Sayfayı yenileyin.";
            });
    }

    // --- 4. TİKE BASILDIĞINDA GOOGLE'A VERİ YAZMA ---
    function tikAt(sicil, isim) {
        let btn = document.getElementById(`btn-${sicil}`);
        btn.innerText = "Yükleniyor...";
        btn.disabled = true;

        // islem=yaz parametresiyle veriyi yolluyoruz
        let url = `${GOOGLE_SCRIPT_URL}?islem=yaz&sicil=${sicil}&isim=${encodeURIComponent(isim)}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if(data.sonuc === "basarili") {
                    btn.innerText = "Kaydedildi ✓";
                    // Buton zaten disabled olduğu için bir daha tıklanamaz
                }
            })
            .catch(error => {
                alert("Bağlantı koptu. Lütfen tekrar deneyin.");
                btn.innerText = "Tik At ✓";
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
